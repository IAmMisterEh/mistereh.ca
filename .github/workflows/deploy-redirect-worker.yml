name: Deploy Game Redirect Worker

on:
  push:
    branches: [ "main" ]
    paths:
      - 'steam-punk-games-redirect-worker/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy Redirect Worker
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install wrangler
      run: npm install -g wrangler
      
    - name: Deploy redirect Worker
      env:
        CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying game redirect Worker..."
        echo "   Route: mistereh.ca/steam-punk-games/*"
        echo "   Target: https://88eb6ec3.mistereh-ca.pages.dev/*"
        
        cd steam-punk-games-redirect-worker
        
        # Deploy the Worker with custom domain routing
        wrangler deploy
        
        echo "✅ Redirect Worker deployed!"
        echo "Game will be accessible at: https://mistereh.ca/steam-punk-games/"
