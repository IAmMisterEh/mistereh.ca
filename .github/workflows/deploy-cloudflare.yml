name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Wrangler
      run: npm install -g wrangler@3
      
    - name: Verify Credentials
      env:
        CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🔑 Verifying Cloudflare credentials..."
        echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:-<NOT SET>}"
        if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID is not set!"
          exit 1
        fi
        # Test API connectivity with wrangler whoami
        echo "Testing Cloudflare API connection..."
        wrangler whoami --format=json || {
          echo "❌ WARNING: wrangler whoami failed, checking credentials..."
          echo "API Token present: ${CLOUDFLARE_API_TOKEN:+yes}"
          exit 1
        }
        echo "✅ API connection successful!"

    - name: Create Project if Not Exists
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "📦 Checking if project 'clockwork-words-v2' exists..."
        PROJECT=$(wrangler pages project list --format=json 2>/dev/null || echo "[]")
        echo "$PROJECT" | grep -q "clockwork-words-v2" && echo "✅ Project exists!" || {
          echo "🆕 Creating project 'clockwork-words-v2'..."
          wrangler pages project create clockwork-words-v2 --subdomain=mistereh \
            --account-id=$CLOUDFLARE_ACCOUNT_ID --commit-hash=none || {
            echo "❌ Failed to create project!"
            exit 1
          }
          echo "✅ Project created!"
        }

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying Clockwork Words v2.0 to Cloudflare Pages..."
        wrangler pages deploy ./steam-punk-games \
          --project-name=clockwork-words-v2 \
          --commit-hash=${{ github.sha }}
