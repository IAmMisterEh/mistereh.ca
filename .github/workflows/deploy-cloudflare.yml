name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Validate Cloudflare credentials
      run: |
        echo "🔍 Validating Cloudflare credentials before deployment..."
        
        # Check if secrets are set
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ CLOUDFLARE_ACCOUNT_ID not set!"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ CLOUDFLARE_API_TOKEN not set!"
          exit 1
        fi
        
        # Check if token looks like the right type (Global API Key starts with cfk_)
        if [[ ! "${{ secrets.CLOUDFLARE_API_TOKEN }}" =~ ^cfk_ ]]; then
          echo "⚠️  Warning: API token doesn't start with 'cfk_'"
          echo "   You might be using an API Token (cfat_) instead of a Global API Key (cfk_)"
          echo "   Pages deployments require a Global API Key!"
          echo ""
          echo "   To fix: Generate a Global API Key at:"
          echo "   https://dash.cloudflare.com/profile/api-tokens"
          echo "   (Not the 'API Tokens' section - go to 'Global API Key')"
          exit 1
        else
          echo "✅ API token looks correct (starts with 'cfk_')"
        fi
        
        # Test the credentials against Cloudflare API
        echo "📡 Testing credentials with Cloudflare API..."
        response=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json")
        
        if echo "$response" | grep -q '"success":true'; then
          echo "✅ Credentials are valid!"
          account_id=$(echo "$response" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "   Account ID: $account_id"
          
          if [ "$account_id" != "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "⚠️  Warning: API token account ID doesn't match configured account!"
            echo "   Token is for account: $account_id"
            echo "   Configured account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            exit 1
          else
            echo "✅ Account ID matches!"
          fi
        else
          echo "❌ Credentials test failed!"
          echo "$response"
          exit 1
        fi
        
        echo "✨ All checks passed! Ready to deploy."
      
    - name: Deploy to Cloudflare Pages
      id: deployment
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        directory: .
        projectName: clockwork-words-v2

