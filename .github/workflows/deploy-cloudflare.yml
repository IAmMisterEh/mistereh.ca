name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # Note: No cache needed for static site deployment
        # cache: 'npm'  # Only needed if we had package.json
        
    - name: Install wrangler
      run: npm install -g wrangler
      
    - name: Validate Cloudflare credentials
      run: |
        echo "🔍 Validating Cloudflare credentials..."
        
        # Test the credentials against Cloudflare API
        response=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json")
        
        if echo "$response" | grep -q '"success":true'; then
          echo "✅ Credentials are valid!"
          account_id=$(echo "$response" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "   Account ID: $account_id"
          
          if [ "$account_id" != "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ Account ID mismatch!"
            echo "   Token is for account: $account_id"
            echo "   Configured account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            exit 1
          else
            echo "✅ Account ID matches!"
          fi
        else
          echo "❌ Credentials test failed!"
          echo "$response"
          exit 1
        fi
        
        echo "✨ Credentials validated. Ready to deploy."
      
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying steam-punk-games to Cloudflare Pages..."
        
        cd steam-punk-games
        
        # Deploy using wrangler
        wrangler pages deploy . \
          --project-name=mistereh-ca \
          --branch=main \
          --commit-dirty=true
        
        echo "✅ Deployment complete!"
