name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Wrangler
      run: npm install -g wrangler@3
      
    - name: Test Credentials
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🔑 Testing Cloudflare credentials..."
        echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:8}..."
        echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:-<NOT SET>}"
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$CLOUDFLARE_API_TOKEN" = "<SET YOUR TOKEN>" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN is not set correctly!"
          exit 1
        fi
        if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID is not set!"
          exit 1
        fi
        echo "✅ Credentials look good!"
    
    - name: Configure Wrangler
      run: |
        echo "📝 Configuring wrangler with Cloudflare credentials..."
        echo "CLOUDFLARE_ACCOUNT_ID set: ${CLOUDFLARE_ACCOUNT_ID:+yes}"
        echo "CLOUDFLARE_API_TOKEN configured: ${CLOUDFLARE_API_TOKEN:+yes}"
        # Create wrangler.toml if it doesn't exist
        if [ ! -f wrangler.toml ]; then
          cat >> wrangler.toml <<'ENDCONFIG'
type = "pages"
account_id = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
ENDCONFIG
          echo "✅ Created wrangler.toml"
        fi
    
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying Clockwork Words v2.0 to Cloudflare Pages..."
        wrangler pages deploy ./steam-punk-games \
          --project-name=clockwork-words-v2 \
          --commit-hash=${{ github.sha }}
