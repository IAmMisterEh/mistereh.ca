name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Wrangler
      run: npm install -g wrangler@3
      
    - name: Test Credentials
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🔑 Testing Cloudflare credentials..."
        echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:8}..."
        echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:-<NOT SET>}"
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$CLOUDFLARE_API_TOKEN" = "<SET YOUR TOKEN>" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN is not set correctly!"
          exit 1
        fi
        if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID is not set!"
          exit 1
        fi
        echo "✅ Credentials look good!"

    - name: Configure Wrangler
      env:
        WRANGLER_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "📝 Creating wrangler.toml..."
        cat > wrangler.toml <<'WRANGLER_EOF'
type = "pages"
account_id = "$WRANGLER_ACCOUNT_ID"
WRANGLER_EOF
        # Replace the placeholder with actual account ID
        sed -i "s/\$WRANGLER_ACCOUNT_ID/$WRANGLER_ACCOUNT_ID/" wrangler.toml
        cat wrangler.toml
        echo "✅ Created wrangler.toml"

    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying Clockwork Words v2.0 to Cloudflare Pages..."
        wrangler pages deploy ./steam-punk-games \
          --project-name=clockwork-words-v2 \
          --commit-hash=${{ github.sha }}
