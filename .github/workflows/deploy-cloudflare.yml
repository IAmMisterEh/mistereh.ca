name: Deploy mistereh.ca Site

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install wrangler
      run: npm install -g wrangler
      
    - name: Deploy entire site via Cloudflare API
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying entire mistereh.ca site (including steam-punk-games/)..."
        echo "   Account: $CLOUDFLARE_ACCOUNT_ID"
        echo "   Project: mistereh-games-auto"
        
        # Create manifest JSON with BOTH paths (simplified: games/ instead of games/typing/)
        MANIFEST='[{"path":"index.html","mimetype":"text/html"},{"path":"steam-punk-games/index.html","mimetype":"text/html"},{"path":"steam-punk-games/game.js","mimetype":"application/javascript"},{"path":"steam-punk-games/game.css","mimetype":"text/css"},{"path":"games/index.html","mimetype":"text/html"},{"path":"games/game.js","mimetype":"application/javascript"},{"path":"games/game.css","mimetype":"text/css"}]'
        
        echo "Manifest created"
        
        # Upload files to Cloudflare Pages
        echo "Uploading files..."
        DEPLOY_RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mistereh-games-auto/deployments" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -F "manifest=$MANIFEST" \
          -F "index.html=@./index.html" \
          -F "steam-punk-games/index.html=@./steam-punk-games/index.html" \
          -F "steam-punk-games/game.js=@./steam-punk-games/game.js" \
          -F "steam-punk-games/game.css=@./steam-punk-games/game.css" \
          -F "games/index.html=@./steam-punk-games/index.html" \
          -F "games/game.js=@./steam-punk-games/game.js" \
          -F "games/game.css=@./steam-punk-games/game.css")
        
        # Extract deployment info
        DEPLOY_ID=$(echo "$DEPLOY_RESULT" | jq -r '.result.short_id // "unknown"')
        DEPLOY_URL=$(echo "$DEPLOY_RESULT" | jq -r '.result.url // "unknown"')
        STATUS=$(echo "$DEPLOY_RESULT" | jq -r '.success // false')
        
        if [ "$STATUS" = "true" ]; then
          echo "✅ Deployment triggered successfully!"
          echo "Deployment ID: $DEPLOY_ID"
          echo "URL: $DEPLOY_URL"
          echo ""
          echo "After build completes (~2-5 min):"
          echo "Main site: https://mistereh.ca/"
          echo "Game (old path): https://mistereh.ca/steam-punk-games/"
          echo "Game (new path): https://mistereh.ca/games/"
          echo "Both paths serve the same v3.0 game files!"
        else
          echo "❌ Deployment failed!"
          echo "Response: $DEPLOY_RESULT"
          exit 1
        fi
