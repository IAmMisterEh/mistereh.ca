name: Deploy to Cloudflare Pages (v4 - Account Token Support)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'steam-punk-games/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Clockwork Words v3.0 Spiral Escape
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Pre-flight Validation
      run: |
        echo "🔍 Validating deployment prerequisites..."
        
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID not configured"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN not configured"
          exit 1
        fi
        
        echo "✅ Credentials configured successfully!"
        
    - name: Install Wrangler CLI
      run: |
        npm install -g wrangler@3
        wrangler --version
        
    - name: Deploy to Cloudflare Pages
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        echo "🚀 Deploying Clockwork Words v3.0 - Spiral Escape..."
        
        cd steam-punk-games
        
        wrangler pages deploy . \
          --project-name=steam-punk-games \
          --commit-hash="${{ github.sha }}" \
          --commit-message="Deploy Clockwork Words v3.0 Spiral Escape"
        
        echo "✅ Deployment complete!"

    - name: Verify Deployment
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 SUCCESS! Game is live:"
          echo "   https://mistereh.ca/steam-punk-games/"
        else
          echo "❌ DEPLOYMENT FAILED"
          exit 1
        fi
