name: Deploy mistereh.ca Site

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install wrangler
      run: npm install -g wrangler
      
    - name: Deploy entire site
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        echo "🚀 Deploying entire mistereh.ca site (including steam-punk-games/)..."
        echo "   Account: $CLOUDFLARE_ACCOUNT_ID"
        
        # Deploy the entire repo content
        # This will serve:
        # - / → Main site (Coming soon page)
        # - /steam-punk-games/ → The game
        
        wrangler pages deploy . \
          --project-name=mistereh-games-auto \
          --branch=main
        
        echo "✅ Deployment complete!"
        echo "Main site: https://mistereh.ca/"
        echo "Game: https://mistereh.ca/steam-punk-games/"
