name: Deploy Clockwork Words v3.0 to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'steam-punk-games/clockwork-words-v3/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Clockwork Words v3.0 Spiral Escape
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔍 Pre-flight Validation
      run: |
        echo "🔍 Validating Cloudflare deployment prerequisites..."
        
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID not configured"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN not configured"
          exit 1
        fi
        
        ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        if [[ ! "$ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
          echo "❌ ERROR: Invalid CLOUDFLARE_ACCOUNT_ID format (must be 32-char hex)"
          exit 1
        fi
        
        TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        if [[ ! "$TOKEN" =~ ^(cfk_|cfat_|cfut_) ]]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN must start with cfk_*, cfat_*, or cfut_*"
          echo "   Current value starts with: ${TOKEN:0:4}..."
          exit 1
        fi
        
        echo "✅ Credentials validated!"

    - name: 📦 Install Wrangler CLI
      run: |
        npm install -g wrangler@3
        wrangler --version

    - name: 🔐 Authenticate with Cloudflare
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        echo "🔐 Authenticating with Cloudflare..."
        wrangler whoami || echo "⚠️  Note: whoami failed, but continuing..."

    - name: 🏗️ Deploy Clockwork Words v3.0 to Cloudflare Pages (with extended wait and retry)
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        echo "🚀 Deploying Clockwork Words v3.0..."
        cd steam-punk-games/clockwork-words-v3
        
        # Extended wait for Cloudflare API to fully propagate project creation
        echo "⏳ Waiting 60 seconds for Cloudflare API propagation..."
        sleep 60
        
        # List existing projects to verify project exists
        echo "📋 Verifying Cloudflare Pages project exists..."
        wrangler pages project list --account-id="$CLOUDFLARE_ACCOUNT_ID" || {
          echo "⚠️  Could not list projects, continuing with deployment anyway..."
        }
        
        # Attempt deployment with retry logic
        max_attempts=3
        attempt=1
        while [ $attempt -le $max_attempts ]; do
          echo "⏳ Deployment attempt $attempt of $max_attempts..."
          
          if wrangler pages deploy . \
            --project-name=clockwork-words-v3 \
            --commit-hash="${{ github.sha }}" \
            --commit-message="Clockwork Words v3.0 - Spiral Escape deployment"; then
            echo "✅ Deployment successful!"
            exit 0
          fi
          
          echo "⚠️  Attempt $attempt failed, retrying in 15 seconds..."
          attempt=$((attempt + 1))
          if [ $attempt -le $max_attempts ]; then
            sleep 15
          fi
        done
        
        echo "❌ All deployment attempts failed!"
        exit 1

    - name: ✅ Deployment Success Check
      if: success()
      run: |
        echo ""
        echo "=========================================="
        echo "✅ DEPLOYMENT SUCCESSFUL!"
        echo "=========================================="
        echo ""
        echo "🎮 Clockwork Words v3.0 - Spiral Escape"
        echo "   📍 Live: https://clockwork-words-v3.pages.dev/"
        echo ""
