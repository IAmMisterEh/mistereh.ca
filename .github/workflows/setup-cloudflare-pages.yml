name: Setup Cloudflare Pages Project for Clockwork Words

on:
  workflow_dispatch:
    inputs:
      project-name:
        description: 'Cloudflare Pages Project Name (default: clockwork-words-v3)'
        required: false
        default: 'clockwork-words-v3'

permissions:
  contents: read

jobs:
  create-project:
    name: Create Cloudflare Pages Project
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔍 Pre-flight Validation
      run: |
        echo "🔍 Validating Cloudflare credentials..."
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN not configured"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID not configured"
          exit 1
        fi
        
        echo "✅ Credentials found!"
        echo "   Account ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        echo "   Token prefix: ${CLOUDFLARE_API_TOKEN:0:4}..."

    - name: 📦 Install Wrangler CLI
      run: |
        npm install -g wrangler@3
        wrangler --version

    - name: 🔐 Verify Authentication
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        echo "🔍 Testing authentication..."
        wrangler whoami --force || echo "⚠️  Note: wrangler whoami failed, but credentials may still work"

    - name: 🏗️ Create Cloudflare Pages Project
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        PROJECT_NAME="${{ github.event.inputs.project-name || 'clockwork-words-v3' }}"
        
        echo "🚀 Creating Cloudflare Pages project: $PROJECT_NAME"
        
        # Try to create the project if it doesn't exist
        wrangler pages project create "$PROJECT_NAME" --account-id="$CLOUDFLARE_ACCOUNT_ID" || {
          echo "⚠️  Project may already exist or creation failed"
          echo "   This is OK - we'll proceed with deployment anyway"
        }
        
        echo "✅ Project setup complete!"
        echo "   Project name: $PROJECT_NAME"

    - name: 🌐 Verify Project Exists
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        echo "📋 Listing Cloudflare Pages projects..."
        wrangler pages project list --account-id="$CLOUDFLARE_ACCOUNT_ID" || {
          echo "⚠️  Could not list projects, but continuing..."
        }

    - name: ✅ Setup Complete
      run: |
        echo ""
        echo "=========================================="
        echo "✅ CLOUDFLARE PAGES PROJECT SETUP COMPLETE"
        echo "=========================================="
        echo ""
        echo "The Cloudflare Pages project is ready!"
        echo "You can now deploy Clockwork Words v3.0 to:"
        echo "   https://[project-name].pages.dev/"
        echo ""
        echo "To deploy, push changes to steam-punk-games/clockwork-words-v3/"
