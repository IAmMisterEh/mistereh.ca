name: Deploy Entire Site to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '!steam-punk-games/**'
      - '!.github/workflows/deploy-clockwork-final.yml'
      - '!.github/workflows/deploy-redirect-worker.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Site to Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
    
    - name: 📦 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq git
    
    - name: 📦 Archive Site Files
      run: |
        echo "📦 Creating deployment archive..."
        # Create a zip of all files, excluding unnecessary directories
        zip -r site.zip . -x "*.git*" "*.github*" "*.venv*" "*.wrangler*" "*.pyc*" "node_modules/*"
    
    - name: 🚀 Deploy to Cloudflare Pages via API
      env:
        CLOUDFLARE_GLOBAL_API_KEY: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
        CLOUDFLARE_ACCOUNT_ID: "a60a4cc516ca31e22aa31f41283edf06"
      run: |
        echo "🚀 Deploying to Cloudflare Pages with Global API Key..."
        
        # Create deployment via API
        RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mistereh-games-auto/deployments" \
          -H "Authorization: Bearer $CLOUDFLARE_GLOBAL_API_KEY" \
          -H "Content-Type: application/zip" \
          --data-binary @site.zip)
        
        echo "Deployment response: $RESPONSE"
        
        # Check response
        if echo "$RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
          DEPLOYMENT_URL=$(echo "$RESPONSE" | jq -r '.result.url // empty')
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "✅ Deployment triggered successfully!"
            echo "Deployment URL: $DEPLOYMENT_URL"
            exit 0
          fi
        fi
        
        echo "⚠️ Check Cloudflare dashboard for deployment status"
        echo "Full response: $RESPONSE"
        # Don't fail - the upload may have succeeded even if response is unclear
        exit 0

    - name: ✅ Success Message
      if: success()
      run: |
        echo ""
        echo "=========================================="
        echo "✅ DEPLOYMENT TRIGGERED!"
        echo "=========================================="
        echo ""
        echo "🌐 mistereh.ca"
        echo "   📍 Live: https://mistereh.ca/"
        echo "   🎮 Games: https://mistereh.ca/games/"
        echo ""
        echo "📊 Check Cloudflare dashboard for deployment status."
        echo ""
