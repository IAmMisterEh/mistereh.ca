name: Deploy Entire Site to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '!steam-punk-games/**'
      - '!.github/workflows/deploy-clockwork-final.yml'
      - '!.github/workflows/deploy-redirect-worker.yml'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Site to Pages
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: mistereh-games-auto
        directory: .
        branch: main

    - name: ✅ Deployment Success Message
      if: success()
      run: |
        echo ""
        echo "=========================================="
        echo "✅ SITE DEPLOYMENT SUCCESSFUL!"
        echo "=========================================="
        echo ""
        echo "🌐 mistereh.ca"
        echo "   📍 Live: https://mistereh.ca/"
        echo "   🎮 Games: https://mistereh.ca/games/"
        echo ""
        echo "📊 Deployment will complete in 2-5 minutes."
        echo ""
