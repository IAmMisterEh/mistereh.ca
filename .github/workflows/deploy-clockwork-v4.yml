name: Deploy Clockwork Words v3.0 to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'steam-punk-games/clockwork-words-v3/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Clockwork Words v3.0 Spiral Escape
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔍 Pre-flight Validation
      run: |
        echo "🔍 Validating Cloudflare deployment prerequisites..."
        
        # Validate Account ID
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID not configured in GitHub Secrets"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN not configured in GitHub Secrets"
          exit 1
        fi
        
        # Validate Account ID format (32-char hex)
        ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        if [[ ! "$ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID must be 32-character hex string"
          exit 1
        fi
        
        # Validate Token format (must start with cfk_)
        TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        if [[ ! "$TOKEN" =~ ^cfk_ ]]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN must be a Global API Key starting with 'cfk_*'"
          exit 1
        fi
        
        echo ""
        echo "✅ Credentials validated successfully!"
        echo "   Account ID: $ACCOUNT_ID"
        echo "   Token prefix: ${TOKEN:0:4}..."

    - name: 📦 Install Wrangler CLI
      run: |
        npm install -g wrangler@3
        wrangler --version

    - name: 🔐 Test Cloudflare Authentication
      run: |
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        # Test API access by listing existing Pages projects (to verify permissions)
        echo "🔍 Testing Cloudflare API access..."
        wrangler pages project list --account-id="$CLOUDFLARE_ACCOUNT_ID" || {
          echo "⚠️  Note: Could not list projects, but continuing..."
        }

    - name: 🏗️ Deploy Clockwork Words v3.0 to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: clockwork-words-v3
        directory: ./steam-punk-games/clockwork-words-v3
        # Enable caching for faster builds
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        wranglerVersion: '3.x'

    - name: 🌐 Deployment Success Check
      if: success()
      run: |
        echo ""
        echo "=========================================="
        echo "✅ DEPLOYMENT SUCCESSFUL!"
        echo "=========================================="
        echo ""
        echo "🎮 Clockwork Words v3.0 - Spiral Escape"
        echo "   📍 Live: https://clockwork-words-v3.pages.dev/"
        echo "   🔄 Custom domain: https://mistereh.ca/steam-punk-games/clockwork-words-v3/"
        echo ""
        echo "🔗 GitHub Commit: ${{ github.sha }}"
        echo "🔗 Workflow Run:  https://github.com/IAmMisterEh/mistereh.ca/actions/runs/${{ github.run_id }}"

    - name: 📝 Update README with deployment info
      if: success()
      run: |
        echo "Updating documentation with deployment details..."
