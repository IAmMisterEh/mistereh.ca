name: Deploy to Cloudflare Pages (Production-Ready v3)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'steam-punk-games/**'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: 🚀 Deploy Clockwork Words v3.0 Spiral Escape
    runs-on: ubuntu-latest
    
    steps:
    - name: ⬇️ Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔍 Pre-flight Validation
      run: |
        echo "🔍 Validating Cloudflare deployment prerequisites..."
        
        # Validate Account ID
        if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID not configured in GitHub Secrets"
          echo "   Please add it to https://github.com/IAmMisterEh/mistereh.ca/settings/secrets/actions"
          exit 1
        fi
        
        if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN not configured in GitHub Secrets"
          echo "   Please add it to https://github.com/IAmMisterEh/mistereh.ca/settings/secrets/actions"
          exit 1
        fi
        
        # Validate formats
        ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        if [[ ! "$ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]; then
          echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID must be 32-character hex string"
          echo "   Current value prefix: ${ACCOUNT_ID:0:8}..."
          exit 1
        fi
        
        TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        if [[ ! "$TOKEN" =~ ^cfk_ ]]; then
          echo "❌ ERROR: CLOUDFLARE_API_TOKEN must start with 'cfk_*'"
          echo "   Current value starts with: ${TOKEN:0:4}..."
          echo ""
          echo "💡 TIP: Generate Cloudflare Global API Key from:"
          echo "        https://dash.cloudflare.com/profile/api-tokens"
          echo "        Ensure 'Cloudflare Pages: Edit' permission is ENABLED"
          exit 1
        fi
        
        # Mask token for display (show first and last 4 chars only)
        TOKEN_DISPLAY="${TOKEN:0:4}**..."
        
        echo ""
        echo "✅ Account ID: $ACCOUNT_ID"
        echo "✅ API Token:  ***"
        echo "✅ All validations PASSED!"
        echo ""

    - name: 📦 Install Wrangler CLI
      run: |
        echo "📦 Installing Wrangler v3..."
        npm install -g wrangler@3
        wrangler --version

    - name: 🔐 Verify Wrangler Authentication
      run: |
        echo "🔐 Testing Cloudflare authentication..."
        
        export CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
        export CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
        
        # Test with wrangler whoami (if available)
        if command -v wrangler &> /dev/null; then
          echo "🔍 Running: wrangler whoami"
          wrangler whoami --force || {
            echo "⚠️  Note: wrangler whoami may fail due to rate limits, continuing anyway..."
          }
        fi
        
        echo "✅ Wrangler authentication configured with provided credentials"

    - name: 🏗️ Build and Deploy to Cloudflare Pages
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: steam-punk-games
        directory: ./steam-punk-games/clockwork-words-v3
        # Optional: Enable deployment monitoring
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}

    - name: 🌐 Verify Deployment
      if: always()
      run: |
        echo ""
        echo "=========================================="
        echo "📊 DEPLOYMENT STATUS"
        echo "=========================================="
        
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ DEPLOYMENT SUCCESSFUL!"
          echo ""
          echo "🎮 Clockwork Words v3.0 - Spiral Escape is now live:"
          echo "   📍 Production: https://mistereh.ca/steam-punk-games/"
          echo "   🔄 Staging:    https://steam-punk-games.pages.dev"
          echo ""
          echo "🔗 GitHub Commit: ${{ github.sha }}"
          echo "🔗 Workflow Run:  https://github.com/IAmMisterEh/mistereh.ca/actions/runs/${{ github.run_id }}"
        else
          echo "❌ DEPLOYMENT FAILED!"
          echo "   Status: ${{ job.status }}"
          echo ""
          echo "🔍 Troubleshooting:"
          echo "   1. Check GitHub Actions logs for detailed error"
          echo "   2. Verify Cloudflare token has 'Pages Edit' permission"
          echo "   3. Ensure account ID is correct: a60a4cc516ca31e22aa31f41283edf06"
          echo ""
          exit 1
        fi

    - name: 📝 Deployment Summary to README
      if: success()
      run: |
        echo ""
        cd ~/mistereh.ca && git add steam-punk-games/DEPLOYMENT_LOG.md 2>/dev/null || echo "Skipping git commit (no changes needed)"
