<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clockwork Words - Steampunk Typing Game</title>
    <link rel="stylesheet" href="game.css">
    <script defer src="game.js?v=20260922c"></script>
</head>
<body class="steampunk-theme">
    <!-- Main Game Container -->
    <div id="game-container" class="steam-panel">
        <!-- Header with title and stats -->
        <header class="game-header">
            <h1 class="game-title">⚙️ Clockwork Words ⚙️</h1>
            <div class="stats-bar">
                <span class="stat">Level: <span id="level-display" class="stat-value">1</span></span>
                <span class="stat">Score: <span id="score-display" class="stat-value">0</span></span>
                <span class="stat">Time: <span id="time-display" class="stat-value">30</span>s</span>
            </div>
        </header>

        <!-- Main game area - SIDE-BY-SIDE LAYOUT -->
        <main class="game-area">
            <!-- Side-by-side container -->
            <div class="side-by-side-container">
                
                <!-- LEFT: Clock & Timer Section -->
                <section class="clock-section">
                    <div class="clock-container">
                        <div id="clock-face" class="clock-face">
                            <div id="clock-hand" class="clock-hand"></div>
                            <div id="letter-trail" class="letter-trail"></div>
                        </div>
                    </div>
                </section>

                <!-- RIGHT: Word & Input Section -->
                <section class="input-section">
                    <div class="word-display-container">
                        <div id="word-display" class="word-glow">SAMPLE WORD</div>
                        <input 
                            type="text" 
                            id="player-input" 
                            class="steampunk-input" 
                            placeholder="Type the word!"
                            autocomplete="off"
                            autocapitalize="off"
                        >
                        <div id="feedback" class="feedback-message"></div>
                    </div>

                    <!-- Steam effects container -->
                    <div id="steam-effects" class="steam-effects"></div>
                </section>

            </div>
        </main>

        <!-- Controls and progress -->
        <footer class="game-footer">
            <div class="progress-container">
                <div class="progress-label">Clock Progress:</div>
                <div class="progress-bar">
                    <div id="time-bar" class="progress-fill"></div>
                </div>
            </div>
            <div class="controls">
                <button id="start-btn" class="steampunk-button primary">Start Game</button>
                <button id="pause-btn" class="steampunk-button secondary" disabled>Pause</button>
                <button id="restart-btn" class="steampunk-button">Restart</button>
            </div>
        </footer>
    </div>

    <!-- Overlay for Game Over / Level Complete -->
    <div id="overlay" class="game-overlay hidden">
        <div class="overlay-content steam-panel">
            <h2 id="overlay-title" class="overlay-title"></h2>
            <p id="overlay-message" class="overlay-message"></p>
            <div class="overlay-stats">
                <span id="final-score" class="stat-value"></span>
                <span id="final-level" class="stat-value"></span>
            </div>
            <button id="close-overlay" class="steampunk-button primary">Play Again</button>
        </div>
    </div>

    <!-- Steam particle elements -->
    <div id="steam-particles-container"></div>
</body>
</html>
