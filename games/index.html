<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Hub - Under Construction</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            text-align: center;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .construction-container {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        
        h1 {
            color: #d4af37;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .gear-icon {
            font-size: 4em;
            margin: 20px 0;
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 1.2em;
            line-height: 1.6;
            margin: 20px 0;
            color: #b8b8b8;
        }
        
        .coming-soon {
            background: linear-gradient(45deg, #d4af37, #f0e68c);
            color: #1a1a2e;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #d4af37;
            text-decoration: none;
            font-size: 1.1em;
            border: 2px solid #d4af37;
            padding: 10px 25px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: #d4af37;
            color: #1a1a2e;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #2a2a4a;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, #d4af37, #f0e68c);
            animation: progress 2s ease-in-out infinite;
        }
        
        @keyframes progress {
            0%, 100% { width: 30%; }
            50% { width: 70%; }
        }
    </style>
</head>
<body>
    <div class="construction-container">
        <div class="gear-icon">⚙️</div>
        <h1>🚧 UNDER CONSTRUCTION 🚧</h1>
        <p class="message">
            The games workshop is currently being tuned up.<br>
            Our mechanics are installing new machinery and calibrating the clockwork.
        </p>
        <div class="coming-soon">
            COMING SOON
        </div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <p class="message" style="font-size: 0.9em; opacity: 0.8;">
            Check back soon for steam-powered adventures!
        </p>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
